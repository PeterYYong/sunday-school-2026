<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 2학기 우산동성당 초등부 주일학교 교안</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f7f3ec;color:#2f2a25}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.card{background:#fffdf9;border:1px solid #e6ded2;border-radius:16px;padding:24px 28px;box-shadow:0 12px 32px rgba(55,43,31,.08)}
small{display:block;color:#776e65;margin-top:8px}
</style>
</head>
<body>
<div id="status"><div class="card"><strong>2026 2학기 주일학교 교안을 불러오는 중입니다.</strong><small>우산동성당 초등부</small></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('2026-second-semester.html',{cache:'no-store'});
    if(!r.ok)throw new Error('교안 페이지를 불러오지 못했습니다.');
    let html=await r.text();
    html=html.replace(
      "활동지의 '활동해요' 설명과 하트 도안을 보여주며 진행합니다.",
      "교재 뒤편의 그림 카드 도안을 보여주며 안내합니다."
    );
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').innerHTML='<div class="card"><strong>교안을 불러오지 못했습니다.</strong><small>'+e.message+'</small></div>';
  }
})();
</script>
</body>
</html>
