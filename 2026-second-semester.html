function youtubeId(href){
  try{
    const u=new URL(href,location.href);
    if(u.hostname.includes('youtu.be')) return u.pathname.replace(/^\//,'').split('/')[0];
    if(u.hostname.includes('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
    }
  }catch(e){}
  return null;
}

function enhanceVideos(doc){
  const seen=new Set();
  [...doc.querySelectorAll('a[href*="youtube.com"],a[href*="youtu.be"]')].forEach(a=>{
    const id=youtubeId(a.href);
    if(!id) return;
    const section=a.closest('section')||doc.body;
    const key=(section.id||'page')+':'+id;
    if(seen.has(key)||section.querySelector('[data-youtube-id="'+id+'"]')) return;
    seen.add(key);
    const box=doc.createElement('div');
    box.className='portal-video-embed';
    box.dataset.youtubeId=id;
    box.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="YouTube video player" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    const fallback=doc.createElement('div');
    fallback.className='portal-video-fallback';
    fallback.innerHTML='영상이 재생되지 않으면 <a href="https://www.youtube.com/watch?v='+id+'" target="_blank" rel="noopener noreferrer">YouTube에서 열기</a>';
    const target=a.closest('li')||a.parentElement;
    target.insertAdjacentElement('afterend',box);
    box.insertAdjacentElement('afterend',fallback);
  });
}
