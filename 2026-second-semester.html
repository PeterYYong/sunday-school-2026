<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 2학기 우산동성당 초등부 주일학교 교안</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3ec}iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="content" src="2026-second-semester-content.html" title="2026 2학기 주일학교 교안"></iframe>
<script>
const frame=document.getElementById('content');
function youtubeId(href){
  try{const u=new URL(href,location.href);if(u.hostname.includes('youtu.be'))return u.pathname.replace(/^\//,'').split('/')[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2];}}catch(e){}return null;
}
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument||frame.contentWindow.document;if(!doc)return;
  const heroText=doc.querySelector('.home-hero p');if(heroText)heroText.remove();
  const sourceNote=doc.querySelector('.source-note');if(sourceNote)sourceNote.remove();
  const archive=doc.querySelector('.archive-link');if(archive){archive.href='index.html#semester1';archive.target='_top';archive.textContent='↩ 2026 1학기 교안 보기';}
  const style=doc.createElement('style');style.textContent='.portal-video-embed{margin:18px 0 24px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.12);aspect-ratio:16/9}.portal-video-embed iframe{width:100%;height:100%;border:0;display:block}.portal-video-fallback{margin:-12px 0 22px;font-size:.9rem;color:#6b7280}.portal-video-fallback a{color:#c62828;font-weight:800}';doc.head.appendChild(style);
  const seen=new Set();
  [...doc.querySelectorAll('a[href*="youtube.com"],a[href*="youtu.be"]')].forEach(a=>{
    const id=youtubeId(a.href);if(!id)return;const section=a.closest('section')||doc.body;const key=(section.id||'page')+':'+id;if(seen.has(key))return;seen.add(key);
    const box=doc.createElement('div');box.className='portal-video-embed';box.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="YouTube video player" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    const fallback=doc.createElement('div');fallback.className='portal-video-fallback';fallback.innerHTML='영상이 재생되지 않으면 <a href="https://www.youtube.com/watch?v='+id+'" target="_blank" rel="noopener noreferrer">YouTube에서 열기</a>';
    const target=a.closest('li')||a.parentElement;target.insertAdjacentElement('afterend',box);box.insertAdjacentElement('afterend',fallback);
  });
});
</script>
</body>
</html>
